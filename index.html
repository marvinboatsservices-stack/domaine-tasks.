<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Domaine Tasks</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--muted:#667085;--line:#e7eaf0;--accent:#2563eb;--danger:#dc2626;--warn:#d97706;--ok:#16a34a}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 18px;background:linear-gradient(135deg,#0f172a,#243b63);color:white}
header h1{margin:0;font-size:28px} header p{margin:6px 0 0;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;padding:0 14px 12px}.toolbar input,.toolbar select{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font-size:14px}
.section{padding:0 14px}.section h2{font-size:18px;margin:8px 0 10px}
.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 3px 12px rgba(15,23,42,.04)}
.task-top{display:flex;justify-content:space-between;gap:10px}.task h3{margin:0 0 5px;font-size:16px}.meta{font-size:12px;color:var(--muted);line-height:1.5}
.badge{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;white-space:nowrap;height:max-content}.urgent{background:#fee2e2;color:#991b1b}.high{background:#ffedd5;color:#9a3412}.normal{background:#dbeafe;color:#1e40af}.low{background:#e5e7eb;color:#374151}
.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:600;background:#eef2ff;color:#243b63}.actions .delete{background:#fee2e2;color:#991b1b}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));border:0;background:var(--accent);color:#fff;width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 8px 24px rgba(37,99,235,.35)}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
dialog{border:0;border-radius:20px;width:min(92vw,520px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)} dialog::backdrop{background:rgba(15,23,42,.55)}
.modal{padding:18px}.modal h2{margin:0 0 14px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#475467}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.field textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.modal-actions button{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.save{background:var(--accent);color:#fff}.cancel{background:#eef0f4}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><h1>Domaine Tasks</h1><p id="today"></p></header>
<div class="stats">
  <div class="stat"><b id="sTodo">0</b><span>À faire</span></div>
  <div class="stat"><b id="sDoing">0</b><span>En cours</span></div>
  <div class="stat"><b id="sWaiting">0</b><span>En attente</span></div>
  <div class="stat"><b id="sDone">0</b><span>Terminées</span></div>
</div>
<div class="toolbar">
  <input id="search" placeholder="🔎 Rechercher une tâche">
  <select id="filter">
    <option value="">Tous les statuts</option><option>À faire</option><option>En cours</option><option>En attente</option><option>Terminée</option>
  </select>
</div>
<section class="section"><h2>Mes tâches</h2><div id="tasks"></div></section>
<button class="fab" id="addBtn" aria-label="Nouvelle tâche">+</button>
</div>

<dialog id="dlg">
<form class="modal" id="form">
<h2 id="modalTitle">Nouvelle tâche</h2>
<input type="hidden" id="editId">
<div class="field"><label>Titre *</label><input id="title" required placeholder="Ex. Contrôler les pompes du forage"></div>
<div class="field"><label>Lieu</label><input id="place" placeholder="Ex. Local technique"></div>
<div class="field"><label>Date limite</label><input id="due" type="date"></div>
<div class="field"><label>Priorité</label><select id="priority"><option>Normale</option><option>Urgente</option><option>Haute</option><option>Basse</option></select></div>
<div class="field"><label>Statut</label><select id="status"><option>À faire</option><option>En cours</option><option>En attente</option><option>Terminée</option></select></div>
<div class="field"><label>Notes</label><textarea id="notes" placeholder="Détails, prestataire, matériel, etc."></textarea></div>
<div class="modal-actions"><button type="button" class="cancel" id="cancel">Annuler</button><button class="save">Enregistrer</button></div>
</form>
</dialog>

<script>
const KEY="domaineTasks_v1";
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
$("today").textContent=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function badge(p){return p==="Urgente"?"urgent":p==="Haute"?"high":p==="Basse"?"low":"normal"}
function render(){
 const q=$("search").value.toLowerCase(), f=$("filter").value;
 const shown=tasks.filter(t=>(!f||t.status===f)&&([t.title,t.place,t.notes].join(" ").toLowerCase().includes(q)));
 $("tasks").innerHTML=shown.length?shown.sort((a,b)=>(a.status==="Terminée")-(b.status==="Terminée")||(a.due||"9999").localeCompare(b.due||"9999")).map(t=>`
 <article class="task">
  <div class="task-top"><div><h3>${esc(t.title)}</h3><div class="meta">${t.place?"📍 "+esc(t.place)+"<br>":""}${t.due?"📅 "+new Date(t.due+"T12:00:00").toLocaleDateString("fr-FR")+" · ":""}${esc(t.status)}${t.notes?"<br>📝 "+esc(t.notes):""}</div></div><span class="badge ${badge(t.priority)}">${esc(t.priority)}</span></div>
  <div class="actions"><button onclick="cycle('${t.id}')">Changer statut</button><button onclick="editTask('${t.id}')">Modifier</button><button class="delete" onclick="removeTask('${t.id}')">Supprimer</button></div>
 </article>`).join(""):'<div class="empty">Aucune tâche pour le moment.<br>Appuie sur + pour en créer une.</div>';
 $("sTodo").textContent=tasks.filter(t=>t.status==="À faire").length;
 $("sDoing").textContent=tasks.filter(t=>t.status==="En cours").length;
 $("sWaiting").textContent=tasks.filter(t=>t.status==="En attente").length;
 $("sDone").textContent=tasks.filter(t=>t.status==="Terminée").length;
}
function openNew(){ $("form").reset(); $("editId").value=""; $("modalTitle").textContent="Nouvelle tâche"; $("dlg").showModal() }
window.editTask=id=>{const t=tasks.find(x=>x.id===id); if(!t)return; $("editId").value=id; $("title").value=t.title;$("place").value=t.place;$("due").value=t.due;$("priority").value=t.priority;$("status").value=t.status;$("notes").value=t.notes;$("modalTitle").textContent="Modifier la tâche";$("dlg").showModal()}
window.removeTask=id=>{if(confirm("Supprimer cette tâche ?")){tasks=tasks.filter(t=>t.id!==id);save()}}
window.cycle=id=>{const order=["À faire","En cours","En attente","Terminée"],t=tasks.find(x=>x.id===id);t.status=order[(order.indexOf(t.status)+1)%order.length];save()}
$("form").addEventListener("submit",e=>{e.preventDefault();const id=$("editId").value;const obj={id:id||String(Date.now()),title:$("title").value.trim(),place:$("place").value.trim(),due:$("due").value,priority:$("priority").value,status:$("status").value,notes:$("notes").value.trim()}; if(id)tasks=tasks.map(t=>t.id===id?obj:t);else tasks.unshift(obj);save();$("dlg").close()});
$("addBtn").onclick=openNew;$("cancel").onclick=()=>$("dlg").close();$("search").oninput=render;$("filter").onchange=render;render();
</script>
</body>
</html>
