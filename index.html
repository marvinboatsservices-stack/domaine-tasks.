<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10213c"><meta name="apple-mobile-web-app-capable" content="yes"><title>Domaine Les Bois de Peygros</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#15233e}button,input,select,textarea{font:inherit}
header{background:linear-gradient(135deg,#0d1930,#315987);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.8}
.wrap{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:white;border:1px solid #e5e9f0;border-radius:17px;padding:14px;margin-bottom:10px}.login{max-width:440px;margin:8vh auto;padding:20px}
label{font-size:12px;font-weight:700;display:block;margin:9px 0 5px;color:#526079}input,select,textarea{width:100%;border:1px solid #d7dce5;border-radius:11px;padding:11px;background:white}textarea{min-height:80px}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:700;background:#1677ff;color:white}.secondary{background:#eef2f8;color:#263b5d}.danger{background:#fee2e2;color:#991b1b}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.top .btn{padding:8px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.stat{background:white;border:1px solid #e5e9f0;border-radius:14px;padding:10px 5px;text-align:center}.stat b{font-size:20px;display:block}.stat span,.meta{font-size:11px;color:#667085}
.task h3{margin:0 0 5px}.badge{font-size:11px;font-weight:700;border-radius:999px;padding:5px 8px;background:#dbeafe;color:#1e40af}.urgent{background:#fee2e2;color:#991b1b}.high{background:#ffedd5;color:#9a3412}.low{background:#e5e7eb;color:#374151}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{border:0;border-radius:9px;padding:8px 9px;font-weight:650;background:#eef2ff;color:#25395a}
.toolbar{display:flex;gap:7px;margin-bottom:10px}.toolbar input,.toolbar select{min-width:0}dialog{border:0;border-radius:20px;width:min(94vw,540px);padding:0}dialog::backdrop{background:#0f172a99}.modal{padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}#msg{font-size:13px;color:#b42318;margin-top:10px}#sync{font-size:11px;opacity:.8}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style></head><body>
<section id="authView" class="wrap"><div class="card login"><h2>🌳 Domaine Les Bois de Peygros</h2><p>Connexion équipe</p>
<form id="loginForm"><label>E-mail</label><input id="email" type="email" required autocomplete="email"><label>Mot de passe</label><input id="password" type="password" required minlength="6" autocomplete="current-password"><br><br><button class="btn" style="width:100%">Se connecter</button></form>
<div id="msg"></div><p class="meta">Les comptes doivent être autorisés dans Supabase. Chaque membre utilise son propre e-mail et mot de passe.</p></div></section>
<section id="appView" hidden><header><div class="top"><div><h1>Domaine Les Bois de Peygros</h1><p id="userLine"></p><span id="sync">Synchronisation active</span></div><button class="btn secondary" onclick="logout()">Déconnexion</button></div></header>
<div class="wrap"><div class="stats"><div class="stat"><b id="a">0</b><span>À faire</span></div><div class="stat"><b id="b">0</b><span>En cours</span></div><div class="stat"><b id="c">0</b><span>En attente</span></div><div class="stat"><b id="d">0</b><span>Terminées</span></div></div>
<div class="toolbar"><input id="search" placeholder="🔎 Rechercher"><select id="filter"><option value="">Tous</option><option>À faire</option><option>En cours</option><option>En attente</option><option>Terminée</option></select><button class="btn" onclick="openTask()">+</button></div><div id="tasks"></div></div></section>
<dialog id="dlg"><form id="taskForm" class="modal"><h2 id="formTitle">Nouvelle tâche</h2><input id="id" type="hidden">
<label>Titre *</label><input id="title" required><div class="row"><div><label>Catégorie</label><select id="category"><option>Entretien</option><option>Arrosage</option><option>Électricité</option><option>Portail</option><option>Plomberie</option><option>Jardin</option><option>Sécurité</option><option>Autre</option></select></div><div><label>Lieu</label><input id="place"></div></div>
<div class="row"><div><label>Date</label><input id="due" type="date"></div><div><label>Heure</label><input id="time" type="time"></div></div><div class="row"><div><label>Priorité</label><select id="priority"><option>Normale</option><option>Urgente</option><option>Haute</option><option>Basse</option></select></div><div><label>Statut</label><select id="status"><option>À faire</option><option>En cours</option><option>En attente</option><option>Terminée</option></select></div></div>
<label>Attribuée à</label><input id="assigned"><label>Notes / compte rendu</label><textarea id="notes"></textarea><div class="modal-actions"><button type="button" class="btn secondary" onclick="dlg.close()">Annuler</button><button class="btn">Enregistrer</button></div></form></dialog>
<script>
const sb=supabase.createClient("https://upsensfqfjyithssrydn.supabase.co","sb_publishable_naF7b7hx6LGeHZHPhSgUQQ_iEE41ACF");let tasks=[];
const $=x=>document.getElementById(x), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function cls(p){return p==="Urgente"?"urgent":p==="Haute"?"high":p==="Basse"?"low":""}
async function boot(){let {data:{session}}=await sb.auth.getSession();show(session);sb.auth.onAuthStateChange((_e,s)=>show(s))}
function show(s){$("authView").hidden=!!s;$("appView").hidden=!s;if(s){$("userLine").textContent="Connecté : "+s.user.email;load();subscribe()}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("msg").textContent="Connexion...";let {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("msg").textContent=error?error.message:""}
async function logout(){await sb.auth.signOut()}
async function load(){let {data,error}=await sb.from("tasks").select("*").order("created_at",{ascending:false});if(error){$("sync").textContent="Erreur : "+error.message;return}tasks=data||[];render()}
let channel;function subscribe(){if(channel)return;channel=sb.channel("tasks-live").on("postgres_changes",{event:"*",schema:"public",table:"tasks"},()=>load()).subscribe()}
function render(){let q=$("search").value.toLowerCase(),f=$("filter").value,arr=tasks.filter(t=>(!f||t.status===f)&&[t.title,t.category,t.place,t.notes,t.assigned_to].join(" ").toLowerCase().includes(q));$("a").textContent=tasks.filter(t=>t.status==="À faire").length;$("b").textContent=tasks.filter(t=>t.status==="En cours").length;$("c").textContent=tasks.filter(t=>t.status==="En attente").length;$("d").textContent=tasks.filter(t=>t.status==="Terminée").length;$("tasks").innerHTML=arr.length?arr.map(t=>`<div class="card task"><div class="top"><div><h3>${esc(t.title)}</h3><div class="meta">${esc(t.category||"")}${t.place?" · 📍 "+esc(t.place):""}${t.due_date?"<br>📅 "+new Date(t.due_date+"T12:00").toLocaleDateString("fr-FR"):""}${t.due_time?" "+esc(t.due_time.slice(0,5)):""} · ${esc(t.status)}${t.assigned_to?"<br>👤 "+esc(t.assigned_to):""}</div></div><span class="badge ${cls(t.priority)}">${esc(t.priority)}</span></div>${t.notes?`<p>${esc(t.notes)}</p>`:""}<div class="actions"><button onclick="cycle('${t.id}')">Changer statut</button><button onclick="editTask('${t.id}')">Modifier</button></div></div>`).join(""):'<div class="card">Aucune tâche.</div>'}
function openTask(){$("taskForm").reset();$("id").value="";$("formTitle").textContent="Nouvelle tâche";$("dlg").showModal()}
window.editTask=id=>{let t=tasks.find(x=>x.id===id);$("id").value=t.id;$("title").value=t.title;$("category").value=t.category||"Entretien";$("place").value=t.place||"";$("due").value=t.due_date||"";$("time").value=(t.due_time||"").slice(0,5);$("priority").value=t.priority||"Normale";$("status").value=t.status||"À faire";$("assigned").value=t.assigned_to||"";$("notes").value=t.notes||"";$("formTitle").textContent="Modifier la tâche";$("dlg").showModal()}
$("taskForm").onsubmit=async e=>{e.preventDefault();let id=$("id").value,obj={title:$("title").value.trim(),category:$("category").value,place:$("place").value.trim(),due_date:$("due").value||null,due_time:$("time").value||null,priority:$("priority").value,status:$("status").value,assigned_to:$("assigned").value.trim(),notes:$("notes").value.trim(),updated_at:new Date().toISOString()};let r=id?await sb.from("tasks").update(obj).eq("id",id):await sb.from("tasks").insert(obj);if(r.error)alert(r.error.message);else $("dlg").close()}
window.cycle=async id=>{let o=["À faire","En cours","En attente","Terminée"],t=tasks.find(x=>x.id===id),s=o[(o.indexOf(t.status)+1)%o.length];let {error}=await sb.from("tasks").update({status:s,updated_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message)}
$("search").oninput=render;$("filter").onchange=render;boot();
</script></body></html>
